name: Daily DCInside Post Scraping

on:
  schedule:
    # 1. KST 22:05 = UTC 13:05 (당일 데이터 1차 집계)
    - cron: '5 13 * * *'
    # 2. KST 00:05 = UTC 15:05 전날 (전일 데이터 최종 마감 집계)
    - cron: '5 15 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 허용

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 종속 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 어제자 게시글 수집 실행
        run: |
          python scripts/daily_collector.py

      - name: 업데이트된 JSON 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily_counts.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: $(date +'%Y-%m-%d') daily post counts"
            git pull --rebase origin main
            git push origin main
          fi
