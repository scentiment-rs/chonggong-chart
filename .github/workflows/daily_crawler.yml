name: Daily DCInside Post Scrapingon:schedule:# KST 00:05 = UTC 15:05 (전날). Cron format: (분 시 일 월 요일)- cron: '5 15 * * *'workflow_dispatch: # GitHub 웹 UI에서 수동으로 'Run workflow'를 누를 수 있도록 허용permissions:contents: writejobs:scrape-and-update:runs-on: ubuntu-lateststeps:
  - name: 저장소 체크아웃
    uses: actions/checkout@v4

  - name: Python 3.11 설정
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: 종속 패키지 설치
    run: |
      python -m pip install --upgrade pip
      pip install requests beautifulsoup4

  - name: 어제자 게시글 수집 실행
    run: |
      python scripts/daily_collector.py

  - name: 업데이트된 JSON 커밋 및 푸시
    run: |
      git config --global user.name "github-actions[bot]"
      git config --global user.email "github-actions[bot]@users.noreply.github.com"
      git add data/daily_counts.json
      git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: $(date +'%Y-%m-%d') daily post counts" && git push)
